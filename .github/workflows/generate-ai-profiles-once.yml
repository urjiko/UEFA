name: Generate AI profiles once

on:
  push:
    branches:
      - agent/ai-history-batch1-gala-fener
    paths:
      - scripts/build-home-advantage-profiles.mjs
      - data/home-advantage-matches/**
      - data/home-advantage-matches.json
      - .github/workflows/generate-ai-profiles-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-history-batch1-gala-fener
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-home-advantage-profiles.mjs
      - name: Commit generated profile
        run: |
          if git diff --quiet -- generated-home-advantage-profiles.js; then
            echo "Generated profile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated-home-advantage-profiles.js
          git commit -m "Regenerate home advantage profiles"
          git push
