name: Regenerate home advantage snapshot

on:
  push:
    branches:
      - agent/resolve-current-q3-results

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate snapshot
        run: node scripts/build-home-advantage-profiles.mjs
      - name: Commit generated snapshot
        shell: bash
        run: |
          if git diff --quiet -- generated-home-advantage-profiles.js; then
            echo "Snapshot already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated-home-advantage-profiles.js
          git commit -m "Regenerate home advantage profiles"
          git push origin HEAD:agent/resolve-current-q3-results
